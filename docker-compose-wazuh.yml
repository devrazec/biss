name: glpi

services:
  # ---------------------------------------------------------------------------
  # GLPI - Asset & IT Service Management
  # ---------------------------------------------------------------------------
  glpi:
    image: "glpi/glpi:11.0.8"
    container_name: glpi
    restart: "unless-stopped"
    ports:
      - "${GLPI_HTTP_PORT:-8080}:80"
    env_file: .env
    volumes:
      # Named volume holds GLPI config, files, plugins and marketplace (/var/glpi)
      - glpi_data:/var/glpi
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Shared database - one MariaDB server, one database per app
  #   - `glpi`         database + user  (created by the glpi image env vars)
  #   - `zabbix`       database + user  (./db-init/10-zabbix.sql, first boot)
  #   - `guacamole_db` database + user  (./db-init/20-guacamole-*.sql, first boot)
  # ---------------------------------------------------------------------------
  db:
    image: "mariadb:11.4"
    container_name: glpi-db
    restart: "unless-stopped"
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--log-bin-trust-function-creators=1"
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MARIADB_DATABASE: "${GLPI_DB_NAME}"
      MARIADB_USER: "${GLPI_DB_USER}"
      MARIADB_PASSWORD: "${GLPI_DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
      # *.sql / *.sh here run only when db_data is first created
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Zabbix server - monitoring engine
  # ---------------------------------------------------------------------------
  zabbix-server:
    image: "zabbix/zabbix-server-mysql:alpine-7.4-latest"
    container_name: zabbix-server
    restart: "unless-stopped"
    ports:
      - "${ZBX_SERVER_PORT:-10051}:10051"
    environment:
      DB_SERVER_HOST: "db"
      DB_SERVER_PORT: "3306"
      MYSQL_DATABASE: "${ZBX_DB_NAME:-zabbix}"
      MYSQL_USER: "${ZBX_DB_USER:-zabbix}"
      MYSQL_PASSWORD: "${ZBX_DB_PASSWORD:-zabbix}"
      ZBX_STARTPOLLERS: "5"
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Zabbix web frontend (Nginx + PHP)
  # ---------------------------------------------------------------------------
  zabbix-web:
    image: "zabbix/zabbix-web-nginx-mysql:alpine-7.4-latest"
    container_name: zabbix-web
    restart: "unless-stopped"
    ports:
      - "${ZBX_HTTP_PORT:-8081}:8080"
    environment:
      ZBX_SERVER_HOST: "zabbix-server"
      ZBX_SERVER_PORT: "10051"
      DB_SERVER_HOST: "db"
      DB_SERVER_PORT: "3306"
      MYSQL_DATABASE: "${ZBX_DB_NAME:-zabbix}"
      MYSQL_USER: "${ZBX_DB_USER:-zabbix}"
      MYSQL_PASSWORD: "${ZBX_DB_PASSWORD:-zabbix}"
      PHP_TZ: "${TZ:-UTC}"
    depends_on:
      db:
        condition: service_healthy
      zabbix-server:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Zabbix agent 2 - collects metrics; also used to monitor the GLPI container
  # ---------------------------------------------------------------------------
  zabbix-agent:
    image: "zabbix/zabbix-agent2:alpine-7.4-latest"
    container_name: zabbix-agent
    restart: "unless-stopped"
    environment:
      ZBX_SERVER_HOST: "zabbix-server"
      ZBX_HOSTNAME: "Zabbix server"
    depends_on:
      zabbix-server:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Apache Guacamole - clientless remote desktop gateway (RDP / VNC / SSH
  # in the browser). Used for remote administration of assets tracked in GLPI.
  #   guacd      - protocol proxy daemon (internal only)
  #   guacamole  - web app (Tomcat), auth stored in the shared `db` MariaDB
  # ---------------------------------------------------------------------------
  guacd:
    image: "guacamole/guacd:1.6.0"
    container_name: guacd
    restart: "unless-stopped"

  guacamole:
    image: "guacamole/guacamole:1.6.0"
    container_name: guacamole
    restart: "unless-stopped"
    ports:
      - "${GUAC_HTTP_PORT:-8082}:8080"
    environment:
      GUACD_HOSTNAME: "guacd"
      MYSQL_HOSTNAME: "db"
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: "${GUAC_DB_NAME:-guacamole_db}"
      MYSQL_USER: "${GUAC_DB_USER:-guacamole}"
      MYSQL_PASSWORD: "${GUAC_DB_PASSWORD:-guacamole}"
      # Let users authenticated by other extensions (e.g. GLPI SSO later) exist
      MYSQL_AUTO_CREATE_ACCOUNTS: "true"
    depends_on:
      guacd:
        condition: service_started
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # RustDesk server (OSS) - self-hosted ID/rendezvous + relay for the RustDesk
  # remote-desktop client. Lets GLPI-tracked machines be reached by RustDesk ID
  # without going through the public RustDesk infrastructure.
  #   hbbs - ID / rendezvous server (registration, NAT hole punching)
  #   hbbr - relay server (used when a direct P2P connection is not possible)
  #
  # RUSTDESK_RELAY_HOST must be an address the *clients* can reach (the Docker
  # host's LAN/public IP or hostname). 127.0.0.1 only works for clients on this
  # same machine.
  # ---------------------------------------------------------------------------
  rustdesk-hbbr:
    image: "rustdesk/rustdesk-server:1.1.16"
    container_name: rustdesk-hbbr
    restart: "unless-stopped"
    command: hbbr
    ports:
      - "21117:21117"       # relay (client <-> client data)
      - "21119:21119"       # relay for the web client
    volumes:
      - rustdesk_data:/root

  rustdesk-hbbs:
    image: "rustdesk/rustdesk-server:1.1.16"
    container_name: rustdesk-hbbs
    restart: "unless-stopped"
    command: hbbs -r ${RUSTDESK_RELAY_HOST:-127.0.0.1}:21117
    ports:
      - "21115:21115"       # NAT type test
      - "21116:21116"       # ID registration / hole punching (TCP)
      - "21116:21116/udp"   # ID registration / hole punching (UDP)
      - "21118:21118"       # web client
    volumes:
      - rustdesk_data:/root
    depends_on:
      - rustdesk-hbbr

  # ---------------------------------------------------------------------------
  # Wazuh 4.14 - security layer (SIEM / XDR)
  #
  # Threat detection, file integrity monitoring, rootkit & vulnerability
  # detection, security configuration assessment (SCA) and active response for
  # the assets tracked in GLPI. This is the upstream single-node stack
  # (wazuh/wazuh-docker):
  #   wazuh.manager    - analysis engine; agents enroll on 1515, report on 1514
  #   wazuh.indexer    - OpenSearch store for alerts/events (internal only)
  #   wazuh.dashboard  - web UI (HTTPS), served on ${WAZUH_DASHBOARD_PORT}
  #
  # FIRST RUN - generate the TLS certificates once, from the repo root, before
  # the first `docker compose up`:
  #   docker compose -f wazuh/generate-indexer-certs.yml run --rm generator
  #
  # The indexer needs vm.max_map_count >= 262144 on the Docker host (already
  # the case on Docker Desktop). See the README (Wazuh section) for details,
  # default credentials and how to change them.
  # ---------------------------------------------------------------------------
  wazuh.manager:
    image: "wazuh/wazuh-manager:4.14.7"
    container_name: wazuh-manager
    hostname: wazuh.manager
    restart: "unless-stopped"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"        # agent event reporting (TCP)
      - "1515:1515"        # agent enrollment / authd
      - "514:514/udp"      # syslog input
      - "55000:55000"      # Wazuh server REST API
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf

  wazuh.indexer:
    image: "wazuh/wazuh-indexer:4.14.7"
    container_name: wazuh-indexer
    hostname: wazuh.indexer
    restart: "unless-stopped"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./wazuh/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml

  wazuh.dashboard:
    image: "wazuh/wazuh-dashboard:4.14.7"
    container_name: wazuh-dashboard
    hostname: wazuh.dashboard
    restart: "unless-stopped"
    ports:
      - "${WAZUH_DASHBOARD_PORT:-8444}:5601"
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./wazuh/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer
      - wazuh.manager

volumes:
  glpi_data:
  db_data:
  rustdesk_data:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom: