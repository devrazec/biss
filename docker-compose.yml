name: glpi

services:
  # ---------------------------------------------------------------------------
  # GLPI - Asset & IT Service Management
  # ---------------------------------------------------------------------------
  glpi:
    image: "glpi/glpi:11.0.8"
    container_name: glpi
    restart: "unless-stopped"
    ports:
      - "${GLPI_HTTP_PORT:-8080}:80"
    env_file: .env
    volumes:
      # Named volume holds GLPI config, files, plugins and marketplace (/var/glpi)
      - glpi_data:/var/glpi
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # GLPI Agent - Network Discovery + Network (SNMP) Inventory
  #
  # Runs in managed mode: it registers against the GLPI server and opens an
  # HTTP control listener on 62354 so the GLPI Inventory plugin
  # (GLPI: Setup > Plugins > GLPI Inventory) can push NetDiscovery /
  # NetInventory jobs to it. The bundled ToolBox UI
  # (http://localhost:${GLPI_AGENT_PORT:-62355}/toolbox) can also launch ad-hoc
  # SNMP sweeps without the server - set IP ranges and SNMP credentials there.
  #
  # NOTE: SNMP / ARP / NetBIOS scans only reach devices this container can
  # reach. On the compose bridge network that is limited to what the Docker
  # host routes to. To scan the host's local LAN, comment out `ports:` and set
  #   network_mode: "host"
  # then point GLPI_SERVER at the host address (e.g. http://<host-ip>:8080/)
  # since the `glpi` container name is not resolvable in host mode.
  #
  # The published host port defaults to 62355, not 62354: a GLPI Agent
  # installed natively on the host already owns 62354. The container's own
  # listener stays 62354 and the GLPI server reaches it as `glpi-agent:62354`
  # on the compose network regardless - the host port is only for the ToolBox
  # UI in your browser.
  # ---------------------------------------------------------------------------
  glpi-agent:
    image: "rdrit/glpi-agent:1.19"
    container_name: glpi-agent
    restart: "unless-stopped"
    # The image entrypoint has a bug: it sets the ToolBox auth password from
    # GLPI_TOOLBOX_AUTH_USER instead of ..._PASSWORD, so the password always
    # equals the username. Patch that one line before the real entrypoint runs.
    entrypoint:
      - /bin/bash
      - -c
      - |
        sed -i 's#AUTH_PASSWORD="$${GLPI_TOOLBOX_AUTH_USER:-""}"#AUTH_PASSWORD="$${GLPI_TOOLBOX_AUTH_PASSWORD:-""}"#' /usr/local/bin/docker-entrypoint.sh
        exec /usr/local/bin/docker-entrypoint.sh
    ports:
      - "${GLPI_AGENT_PORT:-62355}:62354"
    environment:
      GLPI_SERVER: "http://glpi:80/"
      GLPI_SERVER_NO_SSL_CHECK: "true"
      GLPI_TAG: "${GLPI_AGENT_TAG:-network-scanner}"
      GLPI_HTTPD: "true"
      GLPI_HTTPD_PORT: "62354"
      GLPI_TOOLBOX_ENABLE: "1"
      GLPI_TOOLBOX_AUTH_ENABLE: "true"
      GLPI_TOOLBOX_AUTH_USER: "${GLPI_AGENT_TOOLBOX_USER:-admin}"
      GLPI_TOOLBOX_AUTH_PASSWORD: "${GLPI_AGENT_TOOLBOX_PASSWORD:-admin}"
    volumes:
      # ToolBox config: navbar pages, SNMP credentials, IP ranges, scan jobs.
      # Bind-mounted so it is host-editable/versionable. The agent rewrites it
      # when you save changes in the UI, so the real file is git-ignored.
      #   cp glpi-agent/toolbox.yaml.example glpi-agent/toolbox.yaml
      - ./glpi-agent/toolbox.yaml:/etc/glpi-agent/toolbox.yaml
      # Agent identity (deviceid) + locally stored scan results
      - glpi_agent_data:/var/lib/glpi-agent
    depends_on:
      glpi:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Shared database - one MariaDB server, one database per app
  #   - `glpi`         database + user  (created by the glpi image env vars)
  #   - `zabbix`       database + user  (./db-init/10-zabbix.sql, first boot)
  #   - `guacamole_db` database + user  (./db-init/20-guacamole-*.sql, first boot)
  # ---------------------------------------------------------------------------
  db:
    image: "mariadb:11.4"
    container_name: glpi-db
    restart: "unless-stopped"
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--log-bin-trust-function-creators=1"
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MARIADB_DATABASE: "${GLPI_DB_NAME}"
      MARIADB_USER: "${GLPI_DB_USER}"
      MARIADB_PASSWORD: "${GLPI_DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
      # *.sql / *.sh here run only when db_data is first created
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Zabbix server - monitoring engine
  # ---------------------------------------------------------------------------
  zabbix-server:
    image: "zabbix/zabbix-server-mysql:alpine-7.4-latest"
    container_name: zabbix-server
    restart: "unless-stopped"
    ports:
      - "${ZBX_SERVER_PORT:-10051}:10051"
    environment:
      DB_SERVER_HOST: "db"
      DB_SERVER_PORT: "3306"
      MYSQL_DATABASE: "${ZBX_DB_NAME:-zabbix}"
      MYSQL_USER: "${ZBX_DB_USER:-zabbix}"
      MYSQL_PASSWORD: "${ZBX_DB_PASSWORD:-zabbix}"
      ZBX_STARTPOLLERS: "5"
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Zabbix web frontend (Nginx + PHP)
  # ---------------------------------------------------------------------------
  zabbix-web:
    image: "zabbix/zabbix-web-nginx-mysql:alpine-7.4-latest"
    container_name: zabbix-web
    restart: "unless-stopped"
    ports:
      - "${ZBX_HTTP_PORT:-8081}:8080"
    environment:
      ZBX_SERVER_HOST: "zabbix-server"
      ZBX_SERVER_PORT: "10051"
      DB_SERVER_HOST: "db"
      DB_SERVER_PORT: "3306"
      MYSQL_DATABASE: "${ZBX_DB_NAME:-zabbix}"
      MYSQL_USER: "${ZBX_DB_USER:-zabbix}"
      MYSQL_PASSWORD: "${ZBX_DB_PASSWORD:-zabbix}"
      PHP_TZ: "${TZ:-UTC}"
    depends_on:
      db:
        condition: service_healthy
      zabbix-server:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Zabbix agent 2 - collects metrics; also used to monitor the GLPI container
  # ---------------------------------------------------------------------------
  zabbix-agent:
    image: "zabbix/zabbix-agent2:alpine-7.4-latest"
    container_name: zabbix-agent
    restart: "unless-stopped"
    environment:
      ZBX_SERVER_HOST: "zabbix-server"
      ZBX_HOSTNAME: "Zabbix server"
    depends_on:
      zabbix-server:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Apache Guacamole - clientless remote desktop gateway (RDP / VNC / SSH
  # in the browser). Used for remote administration of assets tracked in GLPI.
  #   guacd      - protocol proxy daemon (internal only)
  #   guacamole  - web app (Tomcat), auth stored in the shared `db` MariaDB
  # ---------------------------------------------------------------------------
  guacd:
    image: "guacamole/guacd:1.6.0"
    container_name: guacd
    restart: "unless-stopped"

  guacamole:
    image: "guacamole/guacamole:1.6.0"
    container_name: guacamole
    restart: "unless-stopped"
    ports:
      - "${GUAC_HTTP_PORT:-8083}:8080"
    environment:
      GUACD_HOSTNAME: "guacd"
      MYSQL_HOSTNAME: "db"
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: "${GUAC_DB_NAME:-guacamole_db}"
      MYSQL_USER: "${GUAC_DB_USER:-guacamole}"
      MYSQL_PASSWORD: "${GUAC_DB_PASSWORD:-guacamole}"
      # Let users authenticated by other extensions (e.g. GLPI SSO later) exist
      MYSQL_AUTO_CREATE_ACCOUNTS: "true"
    depends_on:
      guacd:
        condition: service_started
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # RustDesk server (OSS) - self-hosted ID/rendezvous + relay for the RustDesk
  # remote-desktop client. Lets GLPI-tracked machines be reached by RustDesk ID
  # without going through the public RustDesk infrastructure.
  #   hbbs - ID / rendezvous server (registration, NAT hole punching)
  #   hbbr - relay server (used when a direct P2P connection is not possible)
  #
  # RUSTDESK_RELAY_HOST must be an address the *clients* can reach (the Docker
  # host's LAN/public IP or hostname). 127.0.0.1 only works for clients on this
  # same machine.
  # ---------------------------------------------------------------------------
  rustdesk-hbbr:
    image: "rustdesk/rustdesk-server:1.1.16"
    container_name: rustdesk-hbbr
    restart: "unless-stopped"
    command: hbbr
    ports:
      - "21117:21117"       # relay (client <-> client data)
      - "21119:21119"       # relay for the web client
    volumes:
      - rustdesk_data:/root

  rustdesk-hbbs:
    image: "rustdesk/rustdesk-server:1.1.16"
    container_name: rustdesk-hbbs
    restart: "unless-stopped"
    command: hbbs -r ${RUSTDESK_RELAY_HOST:-127.0.0.1}:21117
    ports:
      - "21115:21115"       # NAT type test
      - "21116:21116"       # ID registration / hole punching (TCP)
      - "21116:21116/udp"   # ID registration / hole punching (UDP)
      - "21118:21118"       # web client
    volumes:
      - rustdesk_data:/root
    depends_on:
      - rustdesk-hbbr

volumes:
  glpi_data:
  glpi_agent_data:
  db_data:
  rustdesk_data: