name: glpi

services:
  glpi:
    image: "glpi/glpi:11.0.8"
    container_name: glpi
    restart: "unless-stopped"
    ports:
      - "${GLPI_HTTP_PORT:-8080}:80"
    env_file: .env
    volumes:
      # Named volume holds GLPI config, files, plugins and marketplace (/var/glpi)
      - glpi_data:/var/glpi
    depends_on:
      db:
        condition: service_healthy

  db:
    image: "mariadb:11.4"
    container_name: glpi-db
    restart: "unless-stopped"
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: "${GLPI_DB_NAME}"
      MARIADB_USER: "${GLPI_DB_USER}"
      MARIADB_PASSWORD: "${GLPI_DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  glpi_data:
  db_data:
